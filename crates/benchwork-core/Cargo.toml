[package]
name = "benchwork-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core domain types, workspace aggregation, and multi-crate services for benchwork"

[lints]
workspace = true

[dependencies]
batten-core = "0.1.0-beta.2"
chalkline-core = "0.1.0-beta.2"
dado-core = "0.1.0-beta.2"
joiner-core = "0.1.0-beta.2"
miter-engine = "0.1.0-alpha.3"
sawhorse-core = "0.1.0-beta.2"
storypole-core = "0.1.0-beta.2"

async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["sync", "time", "rt", "macros", "fs"] }
toml = "1.1"
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.10"
